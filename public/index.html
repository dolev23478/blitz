<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telegram Collector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside>
    <div class="top">
      <h1 data-i18n="channels">Channels</h1>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="he">עברית</option>
      </select>
    </div>
    <form id="add-form">
      <input id="add-input" data-i18n-placeholder="addPlaceholder" dir="ltr" required />
      <button data-i18n="add">Add</button>
    </form>
    <p id="add-error" class="error"></p>
    <ul id="channels"></ul>
  </aside>
  <main>
    <section id="tg" class="tg" hidden>
      <strong data-i18n="tgTitle">Telegram account</strong>
      <span id="tg-status"></span>
      <span id="tg-error" class="error"></span>
    </section>
    <header>
      <select id="filter-channel"><option value="" data-i18n="allChannels">All channels</option></select>
      <input id="search" type="search" data-i18n-placeholder="search" />
      <a href="api.html" target="_blank">API</a>
      <span id="live" class="live" data-i18n="live">● live</span>
    </header>
    <div id="feed"></div>
    <button id="more" hidden data-i18n="loadMore">Load more</button>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
